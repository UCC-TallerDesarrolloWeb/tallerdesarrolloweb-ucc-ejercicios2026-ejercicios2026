<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
    <h3>Suscríbase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form>
        <fieldset>
            <legend>Datos Personales</legend>

            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" size="40" maxlength="40" placeholder="Ingrese su nombre">
            </p>

            <p>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" size="40" maxlength="40" placeholder="Ingrese su apellido">
            </p>

            <p>
                Sexo:
                <input type="radio" id="masculino" name="sexo" value="masculino" checked>
                <label for="masculino">Masculino</label>
                <input type="radio" id="femenino" name="sexo" value="femenino">
                <label for="femenino">Femenino</label>
            </p>

            <p>
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" maxlength="3" placeholder="Edad">
            </p>
        </fieldset>

        <fieldset>
            <legend>Datos de la Cuenta</legend>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" size="40" maxlength="80" placeholder="Ingrese su email">
            </p>

            <p>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" size="40" maxlength="20" placeholder="Ingrese su usuario">
            </p>

            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" size="40" maxlength="20" placeholder="Ingrese su password">
            </p>

            <p>
                <label for="confirmar-password">Confirmar Password:</label>
                <input type="password" id="confirmar-password" name="confirmar-password" size="40" maxlength="20" placeholder="Confirme su password">
            </p>
        </fieldset>

        <fieldset>
            <legend>Tipo de Suscripción</legend>

            <p>
                <label for="servicio">Tipo de servicio:</label>
                <select id="servicio" name="servicio">
                    <option value="free">Free</option>
                    <option value="standard">Standard</option>
                    <option value="premium">Premium</option>
                </select>
            </p>

            <p>
                Tema:
                <input type="checkbox" id="politica" name="tema" value="politica">
                <label for="politica">Política</label>
                <input type="checkbox" id="negocios" name="tema" value="negocios">
                <label for="negocios">Negocios</label>
                <input type="checkbox" id="tecnologia" name="tema" value="tecnologia">
                <label for="tecnologia">Tecnología</label>
                <input type="checkbox" id="salud" name="tema" value="salud">
                <label for="salud">Salud</label>
            </p>

            <p>
                <label for="comentario">Agregue un comentario:</label>
                <textarea id="comentario" name="comentario" rows="5" cols="50" placeholder="Escriba su comentario"></textarea>
            </p>

            <p>
                <input type="submit" value="Enviar">
            </p>
        </fieldset>
    </form>
</body>
</html>
