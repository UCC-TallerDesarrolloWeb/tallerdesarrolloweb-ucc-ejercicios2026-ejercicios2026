<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instagram Responsive</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f3f5f8;
        }

        header {
            padding: 18px;
            text-align: center;
            background-color: #ffffff;
            border-bottom: 1px solid #d8dee8;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
        }

        .instagram-grid {
            width: min(1000px, calc(100% - 28px));
            margin: 24px auto;
            display: grid;
            gap: 12px;
        }

        .instagram-grid div {
            background-color: #ffffff;
            border: 1px solid #d8dee8;
        }

        .instagram-grid img {
            display: block;
            width: 100%;
            height: auto;
        }

        @media (min-width: 601px) {
            .instagram-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .instagram-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Galeria responsive</h1>
    </header>

    <main class="instagram-grid">
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_01.png" alt="Publicacion de Instagram 1">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_02.png" alt="Publicacion de Instagram 2">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_03.png" alt="Publicacion de Instagram 3">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_04.png" alt="Publicacion de Instagram 4">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_05.png" alt="Publicacion de Instagram 5">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_06.png" alt="Publicacion de Instagram 6">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_07.png" alt="Publicacion de Instagram 7">
        </div>
        <div>

</body>
</html>
