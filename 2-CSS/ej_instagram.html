    <style>
        /* Las imágenes ocupan el 100% de su columna */
        .columna img {
            width: 100%;
            display: block;
        }

        .fila {
            display: flex;
            flex-wrap: wrap;
        }

        .columna {
            padding: 4px;
            box-sizing: border-box;
        }

        /* Pantallas de 601px o más: 3 columnas */
        @media screen and (min-width: 601px) {
            .columna {
                width: 33.33%;
            }
        }

        /* Pantallas de 600px o menos: 1 columna */
        @media screen and (max-width: 600px) {
            .columna {
                width: 100%;
            }
        }
    </style>
</head>
