<!DOCTYPE html>
<html>
    <head>
        <title>Cataogo de Productos</title>
        <link href="catalogo.css" typer="text/css" rel="stylesheet">

    </head>
    <body class="grid-container">
        <header class="item1">
            Catalogo de Productos
        </header>
        <nav class="item2">
            <a href="productos.html">Catalogo de Productos</a>
            <a href="productos.html">Carito de compras</a>
        </nav>
        <aside class="item3">
            <form>
                <fieldset>
                    <legend>Buscador</legend>
                    <label for="search">Buscar </label>
                    <input type="text" name="search" id="search" placeholder="Buscar..">
                </fieldset>
                <fieldset>
                    <legend>Precios</legend>
                    <p>
                        <label for="price-min">Minimo </label>
                        <input type="numbre" name="price-min" id="price-min" min="0">
                    </p>
                    <p>
                        <label for="price-max">Maximo </label>
                        <input type="numbre" name="price-max" id="price-max" min="0">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Tipo de Productos</legend>
                    <p>
                        <label for="protectores">protectores </label>
                        <input type="checkbox" name="tipo" id="protectores" values="protectores">
                    </p>
                    <p>
                        <label for="entrenamiento">entrenamiento </label>
                        <input type="checkbox" name="tipo" id="entrenamiento" values="entrenamiento">
                    </p>
                    <p>
                        <label for="Doboks">doboks </label>
                        <input type="checkbox" name="tipo" id="doboks" values="doboks">
                    </p>
                </fieldset>
            </form>
        </aside>
        <main class="item4">
            <div>
                <img src=" https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/cabezal-cerrado.webp" alt="Dobok"
                <h3>Cabezal Cerrado</h3>
            
            </div>
            <div>
                <img src=" https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/dobok.webp" alt="Dobok"
                <h3>Dobok</h3>
            </div>
            <div>
                <img src=" https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/escudo-potencia.webp" alt="Dobok"
                <h3>Escudo Potencia</h3>
            </div>
            <div>
                <img src=" https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/foco-con-dedos.webp" alt="Dobok"
                <h3>Foco con dedos</h3>
            </div>
            <div>
                <img src=" https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-manos.webp" alt="Dobok"
                <h3>Protectores manos</h3>
            </div>
            <div>
                <img src=" https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-pie.webp" alt="Dobok"
                <h3>Protectores Pies</h3>
            </div>
        </main>
        <footer class="item5">
            Contacto
        </footer>

    </body>
</html>
