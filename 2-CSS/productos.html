<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <!-- HOJA DE ESTILOS ENLAZADA -->
    <link rel="stylesheet" href="productos.css">
</head>
<body>

<header>
    <h1>Nuestros Productos</h1>
</header>

<!-- BOTONES DE NAVEGACIÓN -->
<nav>
    <button class="btn btn-catalogo">Catálogo</button>
    <button class="btn btn-carrito">Carrito de Compras</button>
</nav>

<div class="contenedor">

    <!-- FILTROS -->
    <aside class="filtros">
        <form>
            <fieldset>
                <legend>Búsqueda</legend>
                <label for="buscar">Buscar:</label>
                <input type="search" id="buscar" name="buscar">
            </fieldset>

            <fieldset>
                <legend>Precios</legend>
                <p>
                    <label for="minimo">Mínimo:</label>
                    <input type="number" id="minimo" name="minimo" min="0">
                </p>
                <p>
                    <label for="maximo">Máximo:</label>
                    <input type="number" id="maximo" name="maximo" min="0">
                </p>
            </fieldset>

            <fieldset>
                <legend>Tipo de Productos</legend>
                <p>
                    <input type="checkbox" id="protectores" name="categoria" value="Protectores">
                    <label for="protectores">Protectores</label>
                </p>
                <p>
                    <input type="checkbox" id="entrenamiento" name="categoria" value="Entrenamiento">
                    <label for="entrenamiento">Entrenamiento</label>
                </p>
                <p>
                    <input type="checkbox" id="doboks" name="categoria" value="Dobok">
                    <label for="doboks">Doboks</label>
                </p>
            </fieldset>

            <fieldset>
                <legend>Marca</legend>
                <label for="marca">Seleccione:</label>
                <select id="marca" name="marca">
                    <option value="">Todas</option>
                    <option value="Gran Marc">Gran Marc</option>
                    <option value="Daedo">Daedo</option>
                </select>
            </fieldset>

            <button type="submit">Filtrar</button>
            <button type="reset">Limpiar</button>
        </form>
    </aside>

    <!-- TARJETAS -->
    <main class="grid-productos">

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/cabezal-cerrado.webp" alt="Cabezal Sparring">
            <h3>Cabezal Sparring</h3>
        </div>

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/dobok.webp" alt="Dobok Dan">
            <h3>Dobok Dan</h3>
        </div>

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/escudo-potencia.webp" alt="Escudo de Potencia">
            <h3>Escudo de Potencia</h3>
        </div>

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/foco-con-dedos.webp" alt="Par de focos redondos">
            <h3>Par de focos redondos</h3>
        </div>

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-manos.webp" alt="Guantes 10 onzas">
            <h3>Guantes 10 onzas</h3>
        </div>

        <div class="tarjeta">
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-manos.webp" alt="Protectores Pie">
            <h3>Protectores Pie</h3>
        </div>

    </main>

</div>

</body>
</html>
