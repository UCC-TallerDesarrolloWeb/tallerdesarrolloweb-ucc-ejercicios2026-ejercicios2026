<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo de Productos</title>
    <link rel="stylesheet" href="catalogo.css">

</head>
<body class="grid-container"> 
    <header class="item1">
        <h1>Catalogo de Productos</h1>
    </header>
    
    <nav class="item2">
        <a href="ej_productos.html">Catalogo de Productos</a>
        <a href="carrito.html">Carrito de Compras</a>
    </nav>

    <aside class="item3">
        <fieldset>
            <legend>Buscador</legend>
            <label for="buscador">Buscar:</label>
            <input type="text" id="buscador" name="buscador" placeholder="Ingrese el nombre del producto">
        </fieldset>
        <fieldset>
            <legend>Precios</legend>
            <label for ="precioMin">Precio Mínimo:</label>
            <input type="number" id="precioMin" name="precioMin" min="0" placeholder="Ingrese precio mínimo">
            <label for ="precioMax">Precio Máximo:</label>
            <input type="number" id="precioMax" name="precioMax" min="0" placeholder="Ingrese precio máximo">
            <p>
                <label for="precioMin">Precio Mínimo:</label>
                <input type="number" id="precioMin" name="precioMin" min="0" placeholder="Ingrese precio mínimo">
            </p>
            <p>
                <label for="precioMax">Precio Máximo:</label>
                <input type="number" id="precioMax" name="precioMax" min="0" placeholder="Ingrese precio máximo">
            </p>
        </fieldset>
        <fieldset>
            <legend>Tipo de Productos</legend>
            <p>
                <input type="checkbox" name="tipo" id="protectores" value="protectores">
                <label for="protectores">Protectores</label>
            </p>
            <p>
                <input type="checkbox" name="tipo" id="entrenamiento" value="entrenamiento">
                <label for="entrenamiento">Entrenamiento</label>
            </p>
            <p>
                <input type="checkbox" name="tipo" id="dobok" value="dobok">
                <label for="dobok">Dobok</label>
            </p>
        </fieldset>
    </aside>

    <main class="item4">
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/cabezal-cerrado.webp" alt="Cabezal Cerrado">
            <h3>Cabezal Cerrado</h3>
        </div>

        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/dobok.webp" alt="Dobok">
            <h3>Dobok</h3>
        </div>

        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/escudo-potencia.webp" alt="Escudo de Potencia" >
            <h3>Escudo de Potencia</h3>
        </div>

        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/foco-con-dedos.webp" alt="Foco con Dedos">
            <h3>Foco con Dedos</h3>
        </div>

        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-manos.webp" alt="Protectores de Manos">
            <h3>Protectores de Manos</h3>
        </div>

        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-pie.webp" alt="Protectores de Pie">
            <h3>Protectores de Pie</h3>
        </div>
    </main>
