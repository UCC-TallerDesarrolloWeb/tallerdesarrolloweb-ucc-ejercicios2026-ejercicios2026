<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Timeline</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <div class="bg-black text-white p-3 rounded">
        <h2 class="text-center">Timeline del Proyecto</h2>
    </div>

    <div class="row mt-4">

        <div class="col-2 text-center">
            <div class="bg-secondary text-white rounded-circle p-3">
                1
            </div>
        </div>

        <div class="col-10">
            <div class="bg-secondary text-white p-3 rounded">
                <h4 class="fw-bold">Inicio del proyecto</h4>
                <p class="mb-0">
                    Se definieron los objetivos y tareas principales.
                </p>
            </div>
        </div>

    </div>

    <div class="row mt-4">

        <div class="col-2 text-center">
            <div class="bg-secondary text-white rounded-circle p-3">
                2
            </div>
        </div>

        <div class="col-10">
            <div class="border border-light p-3 rounded">
                <h4 class="fw-bold text-info">Diseño</h4>
                <p class="mb-0">
                    Se realizaron los primeros diseños de la interfaz.
                </p>
            </div>
        </div>

    </div>

    <div class="row mt-4">

        <div class="col-2 text-center">
            <div class="bg-secondary text-white rounded-circle p-3">
                3
            </div>
        </div>

        <div class="col-10">
            <div class="border p-3 rounded">
                <h4 class="fw-bold text-warning">Desarrollo</h4>
                <p class="mb-0">
                    Se comenzó con la implementación del proyecto.
                </p>
            </div>
        </div>

    </div>

    <div class="row mt-4">

        <div class="col-2 text-center">
            <div class="bg-secondary text-white rounded-circle p-3">
                4
            </div>
        </div>

        <div class="col-10">
            <div class="border p-3 rounded">
                <h4 class="fw-bold text-danger">Pruebas</h4>
                <p class="mb-0">
                    Se verificó el funcionamiento de la aplicación.
                </p>
            </div>
        </div>

    </div>

</div>

</body>
</html>
