<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .dropdown-menu {
            width: 820px;
        }

        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 20;
            font-size: 20px;
        }
    </style>
    <title>Selector Vuelos</title>
</head>

<body class="p-4">
    <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
            Selecciona la fecha
        </button>

        <div class="dropdown-menu p-4 shadow-sm rounded-3">
            <h4 class="text-center mb-4 text-dark">
                Fechas de Vuelos
            </h4>

            <!-- Encabezados de meses con botones de navegación -->
            <div class="row align-items-center mb-3">
                <div class="col-6 d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-sm border bg-white text-secondary d-flex align-items-center p-1">
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    <span class="fw-bold">Septiembre 2025</span>
                </div>
                <div class="col-6 d-flex align-items-center justify-content-end gap-2">
                    <span class="fw-bold">Octubre 2025</span>
                    <button type="button" class="btn btn-sm border bg-white text-secondary d-flex align-items-center p-1">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            </div>

            <!-- Grilla de calendarios -->
            <div class="row calendar-container">
                <!-- Mes Izquierdo (Septiembre) -->
                <div class="col-6 border-end pe-3">
                    <div class="row fw-bold text-center mb-2">
                        <div class="col">Lun</div>
                        <div class="col">Mar</div>
                        <div class="col">Mie</div>
                        <div class="col">Jue</div>
                        <div class="col">Vie</div>
                        <div class="col">Sab</div>
                        <div class="col">Dom</div>
                    </div>
                    <div class="row text-center py-2 text-secondary">
                        <div class="col">1</div>
                        <div class="col">2</div>
                        <div class="col">3</div>
                        <div class="col">4</div>
                        <div class="col">5</div>
                        <div class="col">6</div>
                        <div class="col">7</div>
                    </div>
                    <div class="row text-center py-2 text-secondary">
                        <div class="col">8</div>
                        <div class="col">9</div>
                        <div class="col">10</div>
                        <div class="col">11</div>
                        <div class="col">12</div>
                        <div class="col">13</div>
                        <div class="col">14</div>
                    </div>
                    <div class="row text-center py-2 text-secondary">
                        <div class="col">15</div>
                        <div class="col">16</div>
                        <div class="col">17</div>
                        <div class="col">18</div>
                        <div class="col">19</div>
                        <div class="col">20</div>
                        <div class="col">21</div>
                    </div>
                    <div class="row text-center py-2 text-secondary">
                        <div class="col">22</div>
                        <div class="col">23</div>
                        <div class="col">24</div>
                        <div class="col">25</div>
                        <div class="col">26</div>
                        <div class="col">27</div>
                        <div class="col">28</div>
                    </div>
                    <div class="row text-center py-2 text-secondary">
                        <div class="col">29</div>
                        <div class="col">30</div>
                        <div class="col text-black-50 opacity-50">1</div>
                        <div class="col text-black-50 opacity-50">2</div>
                        <div class="col text-black-50 opacity-50">3</div>
                        <div class="col text-black-50 opacity-50">4</div>
                        <div class="col text-black-50 opacity-50">5</div>
                    </div>
                </div>

                <!-- Mes Derecho (Octubre) -->
                <div class="col-6 ps-3">
                    <div class="row fw-bold text-center mb-2">
                        <div class="col">Lun</div>
                        <div class="col">Mar</div>
                        <div class="col">Mie</div>
                        <div class="col">Jue</div>
                        <div class="col">Vie</div>
                        <div class="col">Sab</div>
                        <div class="col">Dom</div>
                    </div>
                    <div class="row text-center py-2 text-secondary">
                        <div class="col">1</div>
                        <div class="col">2</div>
                        <div class="col">3</div>
                        <div class="col">4</div>
                        <div class="col">5</div>
                        <div class="col">6</div>
                        <div class="col">7</div>
                    </div>
                    <div class="row text-center py-2 text-secondary">
                        <div class="col">8</div>
                        <div class="col">9</div>
                        <div class="col">10</div>
                        <div class="col">11</div>
                        <div class="col">12</div>
                        <div class="col">13</div>
                        <div class="col">14</div>
                    </div>
                    <div class="row text-center py-2 text-secondary">
                        <div class="col">15</div>
                        <div class="col">16</div>
                        <div class="col">17</div>
                        <div class="col">18</div>
                        <div class="col">19</div>
                        <div class="col">20</div>
                        <div class="col">21</div>
                    </div>
                    <div class="row text-center py-2 text-secondary">
                        <div class="col">22</div>
                        <div class="col">23</div>
                        <div class="col">24</div>
                        <div class="col">25</div>
                        <div class="col">26</div>
                        <div class="col">27</div>
                        <div class="col">28</div>
                    </div>
                    <div class="row text-center py-2 text-secondary">
                        <div class="col">29</div>
                        <div class="col">30</div>
                        <div class="col text-black-50 opacity-50">1</div>
                        <div class="col text-black-50 opacity-50">2</div>
                        <div class="col text-black-50 opacity-50">3</div>
                        <div class="col text-black-50 opacity-50">4</div>
                        <div class="col text-black-50 opacity-50">5</div>
                    </div>
                </div>
            </div>

            <!-- Botones de acción inferiores -->
            <div class="d-flex justify-content-between mt-4">
                <button type="button" class="btn btn-outline-secondary px-4">Cancelar</button>
                <button type="button" class="btn btn-outline-primary px-4">Guardar</button>
            </div>
        </div>
    </div>
</body>

</html>
