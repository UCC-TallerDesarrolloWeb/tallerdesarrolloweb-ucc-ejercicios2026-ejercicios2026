<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selección de vuelos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        defer
    ></script>
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="bg-white border rounded p-4">

        <div class="row">

            <div class="col border-end">
                <p class="text-secondary mb-1">Origen</p>

                <div class="dropdown">
                    <button
                        class="btn btn-outline-secondary dropdown-toggle w-100"
                        type="button"
                        data-bs-toggle="dropdown"
                    >
                        Córdoba
                    </button>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Córdoba</a></li>
                        <li><a class="dropdown-item" href="#">Buenos Aires</a></li>
                        <li><a class="dropdown-item" href="#">Mendoza</a></li>
                    </ul>
                </div>
            </div>

            <div class="col border-end">
                <p class="text-secondary mb-1">Destino</p>

                <div class="dropdown">
                    <button
                        class="btn btn-outline-secondary dropdown-toggle w-100"
                        type="button"
                        data-bs-toggle="dropdown"
                    >
                        Buenos Aires
                    </button>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Buenos Aires</a></li>
                        <li><a class="dropdown-item" href="#">Bariloche</a></li>
                        <li><a class="dropdown-item" href="#">Salta</a></li>
                    </ul>
                </div>
            </div>

            <div class="col border-end">
                <p class="text-secondary mb-1">Fecha</p>
                <p class="fw-bold mb-0">10 Nov 2026</p>
            </div>

            <div class="col">
                <p class="text-secondary mb-1">Pasajeros</p>
                <p class="fw-bold mb-0">1 adulto</p>
            </div>

        </div>

        <div class="d-flex justify-content-end mt-4">
            <button class="btn btn-primary">
                Buscar vuelos
            </button>
        </div>

    </div>

</div>

</body>
</html>
