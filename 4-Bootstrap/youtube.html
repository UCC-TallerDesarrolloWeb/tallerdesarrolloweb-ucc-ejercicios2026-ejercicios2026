<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        .video-card img {
            transition: transform 0.1s ease;
        }

        .video-card img:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body class="bg-dark text-white">

<div class="container my-5">

    <h1 class="mb-4">Videos recomendados</h1>

    <div class="row g-4">

        <div class="col-12 col-md-6 col-lg-4">

            <div class="card text-bg-dark border-0 video-card overflow-hidden">

                <img
                    src="https://picsum.photos/500/300?random=1"
                    class="card-img-top"
                    alt="Miniatura del video"
                >

                <div class="card-body">

                    <div class="row">

                        <div class="col-2">
                            <img
                                src="https://picsum.photos/100?random=10"
                                class="rounded-circle w-100"
                                alt="Canal"
                            >
                        </div>

                        <div class="col-10">

                            <h5 class="card-title fw-bold">
                                Aprendiendo Bootstrap
                            </h5>

                            <a
                                href="#"
                                class="text-light text-decoration-none opacity-50"
                            >
                                Canal de Desarrollo
                            </a>

                            <p class="card-text text-light opacity-50">
                                125 mil visualizaciones · hace 2 días
                            </p>

                        </div>

                    </div>

                    <div class="row mt-2">

                        <div class="col-6">
                            <button class="btn text-secondary w-100">
                                Me gusta
                            </button>
                        </div>

                        <div class="col-6">
                            <button class="btn text-secondary w-100">
                                Compartir
                            </button>
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="col-12 col-md-6 col-lg-4">

            <div class="card text-bg-dark border-0 video-card overflow-hidden">

                <img
                    src="https://picsum.photos/500/300?random=2"
                    class="card-img-top"
                    alt="Miniatura del video"
                >

                <div class="card-body">

                    <div class="row">

                        <div class="col-2">
                            <img
                                src="https://picsum.photos/100?random=11"
                                class="rounded-circle w-100"
                                alt="Canal"
                            >
                        </div>

                        <div class="col-10">

                            <h5 class="card-title fw-bold">
                                Curso de Desarrollo Web
                            </h5>

                            <a
                                href="#"
                                class="text-light text-decoration-none opacity-50"
                            >
                                Programación Web
                            </a>

                            <p class="card-text text-light opacity-50">
                                80 mil visualizaciones · hace 5 días
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="col-12 col-md-6 col-lg-4">

            <div class="card text-bg-dark border-0 video-card overflow-hidden">

                <img
                    src="https://picsum.photos/500/300?random=3"
                    class="card-img-top"
                    alt="Miniatura del video"
                >

                <div class="card-body">

                    <div class="row">

                        <div class="col-2">
                            <img
                                src="https://picsum.photos/100?random=12"
                                class="rounded-circle w-100"
                                alt="Canal"
                            >
                        </div>

                        <div class="col-10">

                            <h5 class="card-title fw-bold">
                                HTML, CSS y JavaScript
                            </h5>

                            <a
                                href="#"
                                class="text-light text-decoration-none opacity-50"
                            >
                                Taller Web
                            </a>

                            <p class="card-text text-light opacity-50">
                                200 mil visualizaciones · hace 1 semana
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
