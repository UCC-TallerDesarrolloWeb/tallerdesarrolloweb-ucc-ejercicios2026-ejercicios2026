<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

<form name="form-suscripcion" action="#" method="post">
    <fieldset>
        <legend>Formulario de Registro</legend>

        <p>
            <label for="nombre">Nombre:</label> 
            <input type="text" id="nombre" name="nombre" placeholder="ingrese su nombre" size="40" maxlength="40">
        </p>
        <p>
            <label for="apellido">Apellido:</label> 
            <input type="text" id="apellido" name="apellido" placeholder="ingrese su apellido" size="40" maxlength="40">
        </p>
        <p>
            Sexo: 
            <label for="masculino">Masculino</label>
            <input type="radio" id="masculino" name="sex" value="masculino"> 
            <label for="femenino">Femenino</label>
            <input type="radio" id="femenino" name="sex" value="femenino">
        </p>        
        <p>
            <label for="edad">Edad:</label> 
            <input type="number" id="edad" name="edad" placeholder="edad" maxlength="3">
        </p> 
        <p>
            <label for="email">Email:</label>  
            <input type="email" id="email" name="email" placeholder="email" size="40" maxlength="50">
        </p>
        <p>
            <label for="usuario">Usuario:</label> 
            <input type="text" id="usuario" name="usuario" placeholder="usuario" size="40" maxlength="20">
        </p>
        <p>
            <label for="password">Password:</label> 
            <input type="password" id="password" name="contraseña" placeholder="contraseña" size="40" maxlength="20">
        </p>
        <p>
            <label for="confirm_password">Confirmar Password:</label> 
            <input type="password" id="confirm_password" name="confirmar_contraseña" placeholder="Repetir contraseña" size="40" maxlength="20">
        </p>
        <p>
            <label for="tipo-servicio">Tipo de servicio:</label> 
            <select id="tipo-servicio" name="tipo-servicio">
                <option value="Free">Free</option>
                <option value="Standard">Standard</option>   
                <option value="Premium">Premium</option>    
            </select>
        </p>
        <p>
            Tema:
            <input type="checkbox" id="politica" value="Política"><label for="politica">Política</label>
            <input type="checkbox" id="negocios" value="Negocios"><label for="negocios">Negocios</label>
            <input type="checkbox" id="tecnologia" value="Tecnología"><label for="tecnologia">Tecnología</label>
            <input type="checkbox" id="salud" value="Salud"><label for="salud">Salud</label>
        </p>
        <p>
            <label for="comentario">Agregue un comentario:</label><br>
            <textarea id="comentario" name="comentario" placeholder="deje su comentario..."></textarea>
        </p>
        <p>
            <input type="submit" value="Boton de Enviar">
        </p>
    </fieldset>
</form>

</body>
</html>
