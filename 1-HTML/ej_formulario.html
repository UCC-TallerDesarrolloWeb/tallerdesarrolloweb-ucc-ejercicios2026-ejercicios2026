<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario - Suscripción</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
            max-width: 600px;
            font-family: Arial, sans-serif;
        }

        fieldset {
            margin-bottom: 15px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        legend {
            font-weight: bold;
            padding: 0 5px;
        }

        label {
            display: inline-block;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <header>
        <h3>¡Suscríbase a Nuestro Portal de Noticias! Crear una cuenta es rápido</h3>
    </header>

    <main>
        <!-- Formulario principal -->
        <form action="#" method="post">
            <!-- Datos Personales -->
            <fieldset>
                <legend>Datos Personales</legend>

                <p>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" size="40" maxlength="40" placeholder="Ingrese su nombre" required>
                </p>

                <p>
                    <label for="apellido">Apellido:</label><br>
                    <input type="text" id="apellido" name="apellido" size="40" maxlength="40" placeholder="Ingrese su apellido" required>
                </p>

                <p>
                    <label>Sexo:</label><br>
                    <input type="radio" id="sexo_m" name="sexo" value="masculino">
                    <label for="sexo_m">Masculino</label>
                    <input type="radio" id="sexo_f" name="sexo" value="femenino">
                    <label for="sexo_f">Femenino</label>
                </p>

                <p>
                    <label for="edad">Edad:</label><br>
                    <input type="number" id="edad" name="edad" min="1" max="120" maxlength="3" placeholder="Ej: 20" required>
                </p>
            </fieldset>

            <!-- Datos de Cuenta -->
            <fieldset>
                <legend>Datos de la Cuenta</legend>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" size="40" maxlength="60" placeholder="ejemplo@correo.com" required>
                </p>

                <p>
                    <label for="usuario">Usuario:</label><br>
                    <input type="text" id="usuario" name="usuario" size="40" maxlength="20" placeholder="Nombre de usuario" required>
                </p>

                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" size="40" maxlength="30" placeholder="Ingrese su contraseña" required>
                </p>

                <p>
                    <label for="confirm_password">Confirmar Password:</label><br>
                    <input type="password" id="confirm_password" name="confirm_password" size="40" maxlength="30" placeholder="Repita su contraseña" required>
                </p>
            </fieldset>

            <!-- Suscripción y Preferencias -->
            <fieldset>
                <legend>Suscripción y Preferencias</legend>

                <p>
                    <label for="tipo_servicio">Tipo de servicio:</label><br>
                    <select id="tipo_servicio" name="tipo_servicio">
                        <option value="free">Free</option>
                        <option value="standard">Standard</option>
                        <option value="premium">Premium</option>
                    </select>
                </p>

                <p>
                    <label>Temas de interés:</label><br>
                    <input type="checkbox" id="tema_politica" name="temas" value="politica">
                    <label for="tema_politica">Política</label><br>
                    <input type="checkbox" id="tema_negocios" name="temas" value="negocios">
                    <label for="tema_negocios">Negocios</label><br>
                    <input type="checkbox" id="tema_tecnologia" name="temas" value="tecnologia">
                    <label for="tema_tecnologia">Tecnología</label><br>
                    <input type="checkbox" id="tema_salud" name="temas" value="salud">
                    <label for="tema_salud">Salud</label>
                </p>

                <p>
                    <label for="comentario">Agregue un comentario:</label><br>
                    <textarea id="comentario" name="comentario" rows="4" cols="45" maxlength="300" placeholder="Escriba su comentario o sugerencia aquí..."></textarea>
                </p>
            </fieldset>

            <!-- Botón de envío -->
            <p>
                <input type="submit" value="Enviar Suscripción">
            </p>
        </form>
    </main>

    <footer>
        <p><a href="ej_noticia.html">&larr; Volver al Inicio</a></p>
    </footer>
</body>

</html>
