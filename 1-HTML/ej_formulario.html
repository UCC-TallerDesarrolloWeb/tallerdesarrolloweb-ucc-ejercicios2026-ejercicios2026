<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio Formulario</title>
    <style>
      form {
        display: block;
        margin-top: 0em;
      }
    </style>
  </head>
  <body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>
      Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!
    </h3>
    <form name="form-suscripcion">
      <p>
        Nombre:
        <input type="text" name="Nombre" placeholder="Nombre" />
      </p>
      <p>
        Apellido:
        <input type="text" name="Apellido" placeholder="Apellido" />
      </p>

      <p>
        Sexo: Masculino
        <input type="radio" name="Genero" value="masculino" />
        Femenino
        <input type="radio" name="Genero" value="masculino" />
      </p>

      <p>
        Edad:
        <input type="numer" name="Edad" placeholder="Edad" />
      </p>

      <p>
        Email:
        <input type="email" name="Email" placeholder="usuario@dominio.com" />
      </p>

      <p>
        Usuario:
        <input type="text" name="Usuario" placeholder="Nombre usuario" />
      </p>

      <p>
        Password:
        <input type="password" name="Pass" placeholder="Contraseña" />
      </p>

      <p>
        Confirmar Password:
        <input
          type="password"
          name="segunda-pass"
          placeholder="Repetir contraseña"
        />
      </p>

      <p>
        Tipo de servicio:
        <select name="Tipo de servicio">
          <option value="Free">Free</option>
          <option value="Standard">Starndard</option>
          <option value="Prmeium">Premium</option>
        </select>
      </p>

      <p>
        Tema: Política
        <input type="checkbox" value="politica" />
        Negocios:
        <input type="checkbox" value="negocios" />
        Tecnologia:
        <input type="checkbox" value="tecnologia" />
        Salud:
        <input type="checkbox" value="salud" />
      </p>

      <p>
        Agregue un comentario:
        <textarea>
                     Deje su comentario...
                </textarea
        >
      </p>
      <p>
        <button type="button">Boton de enviar</button>
      </p>
    </form>
  </body>
</html>
