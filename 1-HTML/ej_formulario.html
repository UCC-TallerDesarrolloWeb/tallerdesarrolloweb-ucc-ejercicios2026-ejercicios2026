<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>

    <form action="#" method="post">
        <fieldset>
            <legend><h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3></legend>

            <p>Nombre: <input type="text" name="nombre" size="40" placeholder="Ingrese su nombre" maxlength="40"></p>

            <p>Apellido: <input type="text" name="apellido" size="40" placeholder="Ingrese su apellido" maxlength="40"></p>

            <p>
                Sexo: 
                Masculino <input type="radio" name="sexo" value="masculino" placeholder="Masculino"> 
                Femenino <input type="radio" name="sexo" value="femenino" placeholder="Femenino">
            </p>

            <p>Edad: <input type="number" name="edad" placeholder="Edad" maxlength="3"></p>

            <p>Email: <input type="email" name="email" size="40" placeholder="ejemplo@correo.com" maxlength="50"></p>

            <p>Usuario: <input type="text" name="usuario" size="40" placeholder="Ingrese su usuario" maxlength="20"></p>

            <p>Password: <input type="password" name="password" size="40" placeholder="Ingrese su contraseña" maxlength="20"></p>

            <p>Confirmar Password: <input type="password" name="confirm_password" size="40" placeholder="Confirme su contraseña" maxlength="20"></p>

            <p>
                Tipo de servicio: 
                <select name="servicio">
                    <option value="free">Free</option>
                    <option value="standard">Standard</option>
                    <option value="premium">Premium</option>
                </select>
            </p>

            <p>
                Tema: 
                <input type="checkbox" name="tema" value="politica" placeholder="Política"> Política 
                <input type="checkbox" name="tema" value="negocios" placeholder="Negocios"> Negocios 
                <input type="checkbox" name="tema" value="tecnologia" placeholder="Tecnología"> Tecnología 
                <input type="checkbox" name="tema" value="salud" placeholder="Salud"> Salud
            </p>

            <p>
                Agregue un comentario:<br>
                <textarea name="comentario" rows="4" cols="40" placeholder="Escriba su comentario aquí..."></textarea>
            </p>

            <p><input type="submit" value="Enviar" placeholder="Enviar"></p>
        </fieldset>
    </form>

</body>
</html>
