<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio Formulario</title>
    <style>
      form {
        display: block;
        margin-top: 0em;
      }
    </style>
  </head>
  <body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>
      Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!
    </h3>
    <form name="form-suscripcion">
      <p>
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" placeholder="ingrese su nombre" />
      </p>
      <p>
        <label for="apellido">Apellido:</label>
        <input type="text" name="apellido" placeholder="ingrese su apellido" />
      </p>
      <p>
        <label for="sexo">Sexo:</label>
        <input type="radio" name="sexo" value="masculino"  checked> Masculino
        <input type="radio" name="sexo" value="femenino" > Femenino
      </p>
      <p>
        <label for="edad">Edad:</label>
        <input type="number" name="edad" placeholder="ingrese su edad" />
      </p>
      <p>
       <label for="email">Email:</label>
        <input type="email" name="email" placeholder="ingrese su email" />
      </p>
      <p>
        <label for="usuario"></label>Usuario:</label>
        <input type="text" name="usuario" placeholder="ingrese su usuario" />
      </p>
      <p>
        <label for="password">Password:</label>
        <input
          type="password"
          name="password"
          placeholder="ingrese su contraseña"
        />
      </p>
      <p>
        <label for="segunda_password">Confirmar Password:</label>
        <input
          type="password"
          name="segunda_password"
          placeholder="confirme su contraseña"
        />
      </p>

      <p>
        <label for="tipo_servicio">Tipo de servicio:</label>
        Tipo de servicio: Free / Standard / Premium
        <select name="tipo_servicio">
          <option>value = "free"</option>
          <option>value = "standard"</option>
          <option>value = "premium"</option>
        </select>
      </p>

      <label for="tema">Tema: Política</label>
      <select name="tema">
        <option value="politica">Política</option>
        <option value="educacion">Educación</option>
        <option value="negocios">Negocios</option>
        <option value="tecnologia">Tecnología</option>
        <option value="salud">Salud</option>
      </select>
    
      <p>
        <label for="comentario">Deje su comentario:</label>
        <textarea name="comentario">
    Deje su comentario...
</textarea
        >
      </p>
      <p>
        <label for="enviar">Boton de Enviar</label>
        <button type="submit">Enviar</button>
      </p>
    </form>
  </body>
</html>
