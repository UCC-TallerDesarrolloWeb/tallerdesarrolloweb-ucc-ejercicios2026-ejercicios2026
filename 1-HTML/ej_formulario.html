<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
<form action="#" method="post">
    <fieldset>
        <legend>Datos Personales</legend>

        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" size="40" maxlength="40" placeholder="Ingrese su nombre">
        </p>

        <p>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" size="40" maxlength="40" placeholder="Ingrese su apellido">
        </p>

        <p>
            Sexo:
            <label><input type="radio" name="sexo" value="masculino">Masculino</label>
            <label><input type="radio" name="sexo" value="femenino">Femenino</label>
        </p>

        <p>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" size="40" maxlength="3" placeholder="Edad">
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" size="40" maxlength="40" placeholder="ejemplo@correo.com">
        </p>
    </fieldset>

    <fieldset>
        <legend>Datos de la Cuenta</legend>

        <p>
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" size="40" maxlength="20" placeholder="Nombre de usuario">
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" size="40" maxlength="20" placeholder="Contraseña">
        </p>

        <p>
            <label for="confirmar_password">Confirmar Password:</label>
            <input type="password" id="confirmar_password" name="confirmar_password" size="40" maxlength="20" placeholder="Repita la contraseña">
        </p>
    </fieldset>

    <fieldset>
        <legend>Preferencias</legend>

        <p>
            <label for="tipo_servicio">Tipo de servicio:</label>
            <select id="tipo_servicio" name="tipo_servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
        </p>

        <p>
            Tema:
            <label><input type="checkbox" name="tema" value="politica">Política</label>
            <label><input type="checkbox" name="tema" value="negocios">Negocios</label>
            <label><input type="checkbox" name="tema" value="tecnologia">Tecnología</label>
            <label><input type="checkbox" name="tema" value="salud">Salud</label>
        </p>

        <p>
            <label for="comentario">Agregue un comentario:</label><br>
            <textarea id="comentario" name="comentario" rows="4" cols="50" placeholder="Escriba su comentario aquí"></textarea>
        </p>
    </fieldset>

    <p>
        <input type="submit" value="Boton de Enviar">
    </p>
</form>


</body>
</html>
