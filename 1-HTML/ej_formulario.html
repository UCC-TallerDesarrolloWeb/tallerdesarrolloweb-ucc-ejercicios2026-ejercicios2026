<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form action="#" method="post">
        <p>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" size="40" maxlength="40" placeholder="Ingrese su nombre">
        </p>

        <p>
            <label for="apellido">Apellido:</label><br>
            <input type="text" id="apellido" name="apellido" size="40" maxlength="40" placeholder="Ingrese su apellido">
        </p>

        <p>
            Sexo:<br>
            <input type="radio" id="masculino" name="sexo" value="masculino"> <label for="masculino">Masculino</label>
            <input type="radio" id="femenino" name="sexo" value="femenino"> <label for="femenino">Femenino</label>
        </p>

        <p>
            <label for="edad">Edad:</label><br>
            <input type="number" id="edad" name="edad" min="1" max="120" maxlength="3" placeholder="Ej: 20">
        </p>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" size="40" maxlength="50" placeholder="correo@ejemplo.com">
        </p>

        <p>
            <label for="usuario">Usuario:</label><br>
            <input type="text" id="usuario" name="usuario" size="40" maxlength="20" placeholder="Elija un usuario">
        </p>

        <p>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" size="40" maxlength="20" placeholder="Contraseña">
        </p>

        <p>
            <label for="confirmar_password">Confirmar Password:</label><br>
            <input type="password" id="confirmar_password" name="confirmar_password" size="40" maxlength="20" placeholder="Repita la contraseña">
        </p>

        <p>
            <label for="servicio">Tipo de servicio:</label><br>
            <select id="servicio" name="servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
        </p>

        <p>
            Tema de interés:<br>
            <input type="checkbox" id="tema_politica" name="tema_politica" value="politica"> <label for="tema_politica">Política</label><br>
            <input type="checkbox" id="tema_negocios" name="tema_negocios" value="negocios"> <label for="tema_negocios">Negocios</label><br>
            <input type="checkbox" id="tema_tecnologia" name="tema_tecnologia" value="tecnologia"> <label for="tema_tecnologia">Tecnología</label><br>
            <input type="checkbox" id="tema_salud" name="tema_salud" value="salud"> <label for="tema_salud">Salud</label>
        </p>

        <p>
            <label for="comentario">Agregue un comentario:</label><br>
            <textarea id="comentario" name="comentario" rows="4" cols="40" placeholder="Escriba su comentario aquí..."></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>

</body>
</html>
