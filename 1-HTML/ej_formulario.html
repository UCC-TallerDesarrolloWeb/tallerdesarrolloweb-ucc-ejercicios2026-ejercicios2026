<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

<form>
  <label for="nombre">Nombre:</label>
  <input type="text" id="nombre" name="nombre" placeholder="Ingresar Nombre" required />
  <br><br>

  <label for="apellido">Apellido:</label>
  <input type="text" id="apellido" name="apellido" placeholder="Ingresar Apellido" required />
  <br><br>

  <label>Sexo:</label>
  <input type="radio" id="masculino" name="sexo" value="masculino" />
  <label for="masculino">Masculino</label>
  <input type="radio" id="femenino" name="sexo" value="femenino" />
  <label for="femenino">Femenino</label>
  <br><br>

  <label for="edad">Edad:</label>
  <input type="number" id="edad" name="edad" placeholder="Ingresar Edad" min="0" />
  <br><br>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required />
  <br><br>

  <label for="usuario">Usuario:</label>
  <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required />
  <br><br>

  <label for="password">Password:</label>
  <input type="password" id="password" name="password" placeholder="Contraseña" required />
  <br><br>

  <label for="confirmar_password">Confirmar Password:</label>
  <input type="password" id="confirmar_password" name="confirmar_password" placeholder="Repetir contraseña" required />
  <br><br>

  <label for="servicio">Tipo de servicio:</label>
  <select id="servicio" name="servicio">
    <option value="free">Free</option>
    <option value="standard">Standard</option>
    <option value="premium">Premium</option>
  </select>
  <br><br>

  <label>Tema:</label><br>
  <input type="checkbox" id="politica" name="tema" value="politica" />
  <label for="politica">Política</label><br>
  <input type="checkbox" id="negocios" name="tema" value="negocios" />
  <label for="negocios">Negocios</label><br>
  <input type="checkbox" id="tecnologia" name="tema" value="tecnologia" />
  <label for="tecnologia">Tecnología</label><br>
  <input type="checkbox" id="salud" name="tema" value="salud" />
  <label for="salud">Salud</label>
  <br><br>

  <label for="comentarios">Agregue un comentario:</label><br>
  <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="Escribe tu comentario aquí..."></textarea>
  <br><br>

  <input type="submit" value="Enviar" />
</form>

</body>
</html>
