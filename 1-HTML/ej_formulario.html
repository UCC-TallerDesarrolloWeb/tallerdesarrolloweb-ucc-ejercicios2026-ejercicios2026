<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

<form action="#" method="post">
    <fieldset>
        <legend>Datos Personales</legend>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido"><br><br>

        <label for="sexo">Sexo:</label>
        <input type="radio" id="masculino" name="sexo" value="masculino">
        <label for="masculino">Masculino</label>
        <input type="radio" id="femenino" name="sexo" value="femenino">
        <label for="femenino">Femenino</label><br><br>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
    </fieldset>

    <fieldset>
        <legend>Datos de la Cuenta</legend>

        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>

        <label for="confirmar">Confirmar Password:</label>
        <input type="password" id="confirmar" name="confirmar"><br><br>
    </fieldset>

    <fieldset>
        <legend>Preferencias</legend>

        <label for="servicio">Tipo de servicio:</label>
        <select id="servicio" name="servicio">
            <option value="free">Free</option>
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
        </select><br><br>

        <label for="tema">Tema:</label><br>
        <input type="checkbox" id="politica" name="tema" value="politica">
        <label for="politica">Política</label><br>
        <input type="checkbox" id="negocios" name="tema" value="negocios">
        <label for="negocios">Negocios</label><br>
        <input type="checkbox" id="tecnologia" name="tema" value="tecnologia">
        <label for="tecnologia">Tecnología</label><br>
        <input type="checkbox" id="salud" name="tema" value="salud">
        <label for="salud">Salud</label><br><br>

        <label for="comentario">Agregue un comentario:</label><br>
        <textarea id="comentario" name="comentario" rows="4" cols="40"></textarea><br><br>
    </fieldset>

    <input type="submit" value="Enviar">
</form>

</body>
</html>
