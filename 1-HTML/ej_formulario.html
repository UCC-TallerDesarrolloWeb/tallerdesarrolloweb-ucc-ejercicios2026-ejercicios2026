<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>

    <h3>Suscríbase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form>
        <fieldset>
            <legend>Datos Personales</legend>

            <p>
                <label for="nombre">Nombre:</label>
                <input 
                    type="text" 
                    id="nombre"
                    name="nombre"
                    size="40" 
                    maxlength="40" 
                    placeholder="Ingrese su nombre">
            </p>

            <p>
                <label for="apellido">Apellido:</label>
                <input 
                    type="text" 
                    id="apellido"
                    name="apellido"
                    size="40" 
                    maxlength="40" 
                    placeholder="Ingrese su apellido">
            </p>

            <p>
                Sexo:
                <input 
                    type="radio" 
                    id="masculino"
                    name="sexo" 
                    value="masculino">
                <label for="masculino">Masculino</label>

                <input 
                    type="radio" 
                    id="femenino"
                    name="sexo" 
                    value="femenino">
                <label for="femenino">Femenino</label>
            </p>

            <p>
                <label for="edad">Edad:</label>
                <input 
                    type="number" 
                    id="edad"
                    name="edad"
                    placeholder="Edad">
            </p>

            <p>
                <label for="email">Email:</label>
                <input 
                    type="email" 
                    id="email"
                    name="email"
                    size="40" 
                    maxlength="60" 
                    placeholder="ejemplo@correo.com">
            </p>
        </fieldset>

        <fieldset>
            <legend>Datos de la Cuenta</legend>

            <p>
                <label for="usuario">Usuario:</label>
                <input 
                    type="text" 
                    id="usuario"
                    name="usuario"
                    size="40" 
                    maxlength="20" 
                    placeholder="Nombre de usuario">
            </p>

            <p>
                <label for="password">Password:</label>
                <input 
                    type="password" 
                    id="password"
                    name="password"
                    maxlength="20" 
                    placeholder="Contraseña">
            </p>

            <p>
                <label for="confirmar-password">Confirmar Password:</label>
                <input 
                    type="password" 
                    id="confirmar-password"
                    name="confirmar-password"
                    maxlength="20" 
                    placeholder="Repita la contraseña">
            </p>
        </fieldset>

        <fieldset>
            <legend>Tipo de Suscripción</legend>

            <p>
                <label for="servicio">Tipo de servicio:</label>
                <select id="servicio" name="servicio">
                    <option>Free</option>
                    <option>Standard</option>
                    <option>Premium</option>
                </select>
            </p>

            <p>
                Tema:

                <input 
                    type="checkbox" 
                    id="politica"
                    name="tema" 
                    value="politica">
                <label for="politica">Política</label>

                <input 
                    type="checkbox" 
                    id="negocios"
                    name="tema" 
                    value="negocios">
                <label for="negocios">Negocios</label>

                <input 
                    type="checkbox" 
                    id="tecnologia"
                    name="tema" 
                    value="tecnologia">
                <label for="tecnologia">Tecnología</label>

                <input 
                    type="checkbox" 
                    id="salud"
                    name="tema" 
                    value="salud">
                <label for="salud">Salud</label>
            </p>

            <p>
                <label for="comentario">Agregue un comentario:</label><br>

                <textarea 
                    id="comentario"
                    name="comentario"
                    rows="4" 
                    cols="50" 
                    placeholder="Escriba su comentario"></textarea>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>

</body>
</html>
