<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de productos</title>

    <link rel="stylesheet" href="catalogo.css">
    <script src="tienda.js"></script>
</head>

<body class="grid-container" onload="mostrarCatalogo(); contarProductos()">

    <header class="item1">
        Catalogo de productos
    </header>

    <nav class="item2">
        <a href="productos.html">Catalogo de productos</a>
        <a href="carritos.html">Carrito de compras</a>
        <div id="cant-prod" >0</div>
    </nav>

    <aside class="item3">
        <form name="filter" id="filter">
            <fieldset>
                <legend>Buscador</legend>
                <label for="search">Buscar</label>
                <input type="text" name="search" id="search" placeholder="buscar ..." onchange="filtrarProductos()">
            </fieldset>
            <fieldset>
                <legend>Precios</legend>
                <p>
                    <label for="minimo">Minimo</label>
                    <input type="number" name="minimo" id="minimo" min="0" onchange="filtrarProductos()">
                </p>
                <p>
                    <label for="maximo">Maximo</label>
                    <input type="number" name="maximo" id="maximo" min="0" onchange="filtrarProductos()">
                </p>
            </fieldset>
            <fieldset>
                <legend>Marca</legend>
                <select id="marca" onchange="filtrarProductos()">
                    <option value="Todas"> Todas</option>
                    <option value="Gran Marc">Gran Marc</option>
                    <option value="Daedo"> Daedo</option>
                </select>
            </fieldset>
            <fieldset>
                <legend>Tipo de Productos</legend>
                <p>
                    <input type="checkbox" name="tipo" id="protectores" value="protectores" onchange="filtrarProductos()">
                    <label for="protectores">Protectores</label>
                </p>
                <p>
                    <input type="checkbox" name="tipo" id="entrenamiento" value="entrenamiento" onchange="filtrarProductos()">
                    <label for="entrenamiento">Entrenamiento</label>
                </p>
                <p>
                    <input type="checkbox" name="tipo" id="doboks" value="doboks" onchange="filtrarProductos()">
                    <label for="doboks">Doboks</label>
                </p>
            </fieldset>
            <fieldset>
                <legend>Ordenar Catalogo</legend>
                <select id="order" onchange="ordenarCatalogo()">
                    <option value="mayor">por Precio - de mayor a menor</option>
                    <option value="menor">por Precio - de menor a mayor</option>
                    <option value="a-z"> por Nombre - de A-Z</option>
                    <option value="z-a"> por Nombre - de Z-A</option>
                </select>
            </fieldset>
        </form>
    </aside>

    <dialog id="modal">
            <h2 id="nombre-producto"></h2>
            <p id="descripcion-producto"></p>
            <button type="button" onclick="cerrarModal()">cerrar</button>
    </dialog>

    <main class="item4" id="catalogo">
        
    </main>

    <footer class="item5">
        contactos
    </footer>

</body>

</html>
