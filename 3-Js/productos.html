<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="productos.css">
    <script type="text/javascript" src="tienda.js"></script>
</head>
<body onload="cargarProductos();contarProductos()">

<header class="item1">
    <h1>Tienda de Taekwondo</h1>
</header>

<nav class="item2">
    <a class="btn btn-catalogo" href="productos.html">Catálogo</a>
    <a class="btn btn-carrito" href="carrito.html">Carrito de Compras</a>
</nav>
<div id="cant-prod">0</div>

<aside class="item3">Posicion para futuros filtros
    <form name="filter">
        <fieldset>
            <legend>Busqueda</legend>
            <label for="search"></label>
            <input type="text" name="search" id="search" placeholder="Palabra..." onchange="filtrarProductos()">
        </fieldset>
        <fieldset>
            <p>
            <legend>Precios</legend>
            <label for="minimo"></label>
            <input type="number" name="minimo" id="precio-min" min="0" onchange="filtrarProductos()">
            </p>
            <p>
            <label for="maximo"></label>
            <input type="number" name="maximo" id="precio-max" min="0" onchange="filtrarProductos()">
            </p>
        </fieldset>
        <fieldset>
            <legend>Marca</legend>
            <select id="marca" onchange="filtrarProductos()">
                <option value="Todas">Todas</option>
                <option value="Gran Marc">Gran Marc</option>
                <option value="Daedo">Daedo</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Tipo de productos</legend>
            <p>
                <input type="checkbox" name="tipo" id="protectores" value="protectores" onchange="filtrarProductos()">    
                <label for="protectores">Protectores</label>
            </p>
            <p>
                <input type="checkbox" name="tipo" id="entrenamiento" value="entrenamiento" onchange="filtrarProductos()">
                <label for="entrenamiento">Entrenamiento</label>
            </p>
            <p>
                <input type="checkbox" id="dobok" name="tipo" value="dobok" onchange="filtrarProductos()">
                <label for="dobok">Dobok</label>
            </p>
        </fieldset>
        <select  id="order" onchange="orderCatalog()">
            <option value="menor">Precio: Menor a Mayor</option>
            <option value="mayor">Precio: Mayor a Menor</option>
            <option value="a-z">Nombre: A-Z</option>
            <option value="z-a">Nombre: Z-A</option>
        </select>
    </form>
</aside>

<main class="item4" id="mostrar-catalogo">

    <dialog id="modal">
        <h2>Detalle del producto</h2>
        <h3 id="titulo-producto">Cabezal Sparring</h3>
        <p id="descr-producto">Cabezal de sparring, disponible del talle 1 al 3, en color rojo y azul.</p>
        <button type="button" onclick="cerrarModal()">Cerrar</button>
    </dialog>

    <div id="contenedor-productos"></div>
</main>

<footer class="item5">Info de Contacto</footer>

</body>
</html>
