<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Grados y Radianes</title>
    <link href="https://fonts.googleapis.com/css?family=Inknut+Antiqua" rel="stylesheet">
    <link href="miEstilo.css" type="text/css" rel="stylesheet">
    <script src="misFunciones.js"></script>
</head>
<body class="body-num">

<div class="centrado div-conver">
    <h1>Grados y Radianes</h1>
    <form>
        <p>
            <label for="grados">Grados</label> = <input id="grados" type="text" name="unid_grados" onchange="convertirAngulos('grados', this.value)">
        </p>
        <p>
            <label for="radianes">Radianes</label> = <input id="radianes" type="text" name="unid_radianes" onchange="convertirAngulos('radianes', this.value)">
        </p>
    </form>
</div>
</body>
</html>
